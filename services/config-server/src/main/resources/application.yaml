server:
  port: 8888

spring:
  application:
    name: config-server
  # profiles:
  #   active: native
  cloud:
    config:
      server:
        # native:
        #   search-locations: file:/config-repo
        git:
          uri: https://github.com/azzichaymae/config-repo
          clone-on-start: true
          default-label: main
          force-pull: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    shutdown:
      enabled: true